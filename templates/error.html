{% extends "base.html" %}
{% block title %}Erro {{ code }}{% endblock %}
{% block content %}<section class="error-panel panel"><span class="error-code">{{ code }}</span><h1>Ops, algo deu errado</h1><p>{{ message }}</p><a class="button primary" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Voltar ao início</a></section>{% endblock %}
