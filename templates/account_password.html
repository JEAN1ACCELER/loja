{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">SEGURANÇA DA CONTA</span><h1>Alterar senha</h1><p>Use uma senha forte e exclusiva para proteger sua conta.</p></div></div>
<form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <div class="form-section"><h2>Credenciais</h2><p>Para confirmar a troca, informe a senha atual.</p><div class="form-grid">
        <label>Senha atual<input type="password" name="current_password" autocomplete="current-password" required></label>
        <span></span>
        <label>Nova senha<input type="password" name="new_password" minlength="12" autocomplete="new-password" required><small class="field-hint">Use pelo menos 12 caracteres.</small></label>
        <label>Confirmar nova senha<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label>
    </div></div>
    <div class="form-actions"><button class="button primary" type="submit">Salvar nova senha</button></div>
</form>
{% endblock %}
