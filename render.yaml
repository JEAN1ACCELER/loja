services:
  - type: web
    name: obra-facil
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    disk:
      name: obra-facil-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/loja.db
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
